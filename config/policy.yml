pull_request_rules:
  - name: vm4 symlink cache repo A marker
    conditions:
      - title = VM4_SYMLINK_CACHE_A_NEVER
    actions:
      comment:
        message: VM4_SYMLINK_CACHE_REPO_A_MARKER
  - name: vm4 unrelated default branch push activation probe
    conditions:
      - title = VM4_SYMLINK_UNRELATED_PUSH_PROBE
    actions:
      comment:
        message: VM4_SYMLINK_UNRELATED_PUSH_POLICY_ACTIVE
